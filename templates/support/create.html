{% extends 'base.html' %}

{% block title %}Create Support Case{% endblock %}

{% block content %}
<div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
    <h1 class="h2"><i class="bi bi-plus-circle"></i> Create Support Case</h1>
</div>

<div class="row">
    <div class="col-md-8">
        <div class="card">
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    
                    <div class="mb-3">
                        <label for="{{ form.subject.id_for_label }}" class="form-label">Subject</label>
                        {{ form.subject }}
                    </div>
                    
                    <div class="mb-3">
                        <label for="{{ form.description.id_for_label }}" class="form-label">Description</label>
                        {{ form.description }}
                        <div class="form-text">Provide detailed information about the issue</div>
                    </div>
                    
                    <div class="mb-3">
                        <label for="{{ form.priority.id_for_label }}" class="form-label">Priority</label>
                        {{ form.priority }}
                    </div>
                    
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">Create Case</button>
                        <a href="{% url 'support_case_list' %}" class="btn btn-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
document.querySelectorAll('select, input, textarea').forEach(el => {
    el.classList.add('form-control');
});
</script>
{% endblock %}
