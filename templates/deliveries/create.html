{% extends 'base.html' %}

{% block title %}Schedule Delivery{% endblock %}

{% block content %}
<div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
    <h1 class="h2"><i class="bi bi-truck"></i> Schedule Delivery for {{ purchase_order.order_number }}</h1>
</div>

<div class="row">
    <div class="col-md-8">
        <div class="card">
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    
                    <div class="mb-3">
                        <label for="{{ form.driver.id_for_label }}" class="form-label">Driver</label>
                        {{ form.driver }}
                    </div>
                    
                    <div class="mb-3">
                        <label for="{{ form.scheduled_date.id_for_label }}" class="form-label">Scheduled Date & Time</label>
                        {{ form.scheduled_date }}
                    </div>
                    
                    <div class="mb-3">
                        <label for="{{ form.notes.id_for_label }}" class="form-label">Notes</label>
                        {{ form.notes }}
                    </div>
                    
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">Schedule Delivery</button>
                        <a href="{% url 'purchase_order_detail' purchase_order.pk %}" class="btn btn-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
document.querySelectorAll('select, input, textarea').forEach(el => {
    el.classList.add('form-control');
});
</script>
{% endblock %}
