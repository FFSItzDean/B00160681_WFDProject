{% extends 'base.html' %}

{% block title %}Add Item to Order{% endblock %}

{% block content %}
<div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
    <h1 class="h2"><i class="bi bi-plus-circle"></i> Add Item to Order {{ order.order_number }}</h1>
</div>

<div class="row">
    <div class="col-md-8">
        <div class="card">
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    
                    <div class="mb-3">
                        <label for="{{ form.product.id_for_label }}" class="form-label">Product</label>
                        {{ form.product }}
                        <div class="form-text">Products from {{ order.supplier.name }}</div>
                    </div>
                    
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="{{ form.quantity.id_for_label }}" class="form-label">Quantity</label>
                            {{ form.quantity }}
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="{{ form.unit_price.id_for_label }}" class="form-label">Unit Price (€)</label>
                            {{ form.unit_price }}
                        </div>
                    </div>
                    
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">Add Item</button>
                        <a href="{% url 'purchase_order_detail' order.pk %}" class="btn btn-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
document.querySelectorAll('select, input, textarea').forEach(el => {
    el.classList.add('form-control');
});
</script>
{% endblock %}
